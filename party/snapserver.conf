# Orpheus party engine — snapserver config
# Orpheus feeds raw PCM over TCP (one ffmpeg, four band-split outputs).
# `mode=server` = snapserver LISTENS and Orpheus connects to it.
#
# FULL  = the whole track           (default for every star)
# THUMP = lows only,  <=160 Hz      (subwoofer / big speaker role)
# HEART = mids,       160Hz-4kHz    (vocals & instruments role)
# AIR   = highs only, >=4 kHz       (sparkle / small bright speaker role)
# All four come from the SAME ffmpeg process, so they stay aligned.

[stream]
source = tcp://0.0.0.0:4953?name=FULL&mode=server&sampleformat=48000:16:2&codec=flac
source = tcp://0.0.0.0:4954?name=THUMP&mode=server&sampleformat=48000:16:2&codec=flac
source = tcp://0.0.0.0:4955?name=HEART&mode=server&sampleformat=48000:16:2&codec=flac
source = tcp://0.0.0.0:4956?name=AIR&mode=server&sampleformat=48000:16:2&codec=flac
buffer = 700
# end-to-end buffer ms — every client plays this far behind the source.
# 700ms absorbs wifi jitter for phones; not perceivable (it's not latency
# between speakers — THEY stay sample-locked — just distance from "live")
codec = flac
send_to_muted = false

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /usr/share/snapserver/snapweb

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[server]
threads = -1

[logging]
sink = stdout
filter = *:info
