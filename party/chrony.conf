# chrony: disciplines the shared WSL2/Docker-VM kernel clock.
# This box's VM clock slews ~+7.5ms/s (measured 2026-07-03), which would
# starve snapserver's buffer and glitch playback. chrony estimates the
# frequency error and continuously corrects it (slew, no steps after boot).
pool pool.ntp.org iburst
makestep 1.0 3
# allow aggressive slew — VM drift here is huge (7500ppm)
maxslewrate 83333.333
driftfile /var/lib/chrony/drift
